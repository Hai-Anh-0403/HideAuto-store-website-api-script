# Cả project trong 1 lệnh:
#
#   docker compose up -d --build     # chạy tất cả (Postgres + server + web)
#   docker compose logs -f server    # xem log
#   docker compose stop              # tắt, giữ dữ liệu
#   docker compose down -v           # xoá sạch cả dữ liệu
#
# Web: http://localhost:3000 · API/Swagger: http://localhost:3001/docs
# Muốn hot reload khi code thì chạy native: `pnpm install && pnpm dev`.
name: store-autohide

services:
  postgres:
    image: postgres:16-alpine
    container_name: sah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store_autohide
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store_autohide"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sah-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/store_autohide
      # Ghi đè bằng secret thật khi deploy — đừng dùng giá trị này ngoài máy local.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      STORAGE_DIR: /data/storage
      PORT: 3001
      # Seeded on first boot so the stack is usable immediately: without an admin,
      # nobody can approve a seller and the portal is a dead end.
      # ⚠️ This default password is public knowledge — override it for anything that
      # is not a laptop.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      # Licensing & packaging: empty by default, so mini apps build without a licence
      # gate rather than failing. Set these to turn activation on.
      LICENSE_SIGNING_KEY: ${LICENSE_SIGNING_KEY:-}
      LICENSE_TTL_DAYS: ${LICENSE_TTL_DAYS:-7}
      STORE_PUBLIC_URL: ${STORE_PUBLIC_URL:-http://localhost:3001}
      MINI_APP_TEMPLATE_PATH: ${MINI_APP_TEMPLATE_PATH:-}
      FLOWDESK_BASE_URL: ${FLOWDESK_BASE_URL:-}
    ports:
      - "3001:3001"
    volumes:
      # Graph đã scrub + artifact build, giữ lại giữa các lần restart.
      - server-storage:/data/storage

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # Build arg, not env: Next compiles the /api/* rewrite into the build output, so
      # this has to be fixed at image build time.
      args:
        API_ORIGIN: http://server:3001
    container_name: sah-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  pg-data:
    name: sah-pg-data
  server-storage:
    name: sah-server-storage
