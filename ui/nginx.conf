# Serves the built SPA and forwards /api to the backend container, so the browser
# still talks to a single origin (same as the Vite proxy in dev).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mini-app packages can be large; don't cap the upload body.
        client_max_body_size 0;
        proxy_read_timeout 300s;
    }
}
