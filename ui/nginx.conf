# Serves the built SPA and forwards /api to the backend container, so the browser
# still talks to a single origin (same as the Vite proxy in dev).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker's embedded DNS. Going through a variable forces nginx to re-resolve
        # `api` instead of caching the IP it saw at startup — rebuilding the API
        # container gives it a new IP, and a cached one turns every call into a 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        # $request_uri keeps path + query: with a variable, nginx no longer passes the
        # original URI on its own.
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mini-app packages can be large; don't cap the upload body.
        client_max_body_size 0;
        proxy_read_timeout 300s;
    }
}
